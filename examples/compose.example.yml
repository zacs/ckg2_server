# examples/compose.example.yml — a starter stack for the reclaimed CloudKey.
# NOT wired into any install script; copy it onto the box and edit to taste.
#
# This box has two PRIMARY jobs, plus some supporting agents:
#   1. technitium   : DNS.
#   2. uptime-kuma  : the OUT-OF-BAND WATCHER / dead-man's-switch. It lives in a
#                     separate failure domain from your Proxmox cluster, so when
#                     the cluster — or the cluster's own monitoring (Beszel hub,
#                     etc.) — goes dark, THIS little box is what's still alive to
#                     scream. That separateness is the entire point.
#   supporting:
#   - arcane-agent  : lets your cluster's Arcane MANAGER manage this Docker host.
#   - beszel-agent  : ships this box's metrics/temps to your central Beszel hub
#                     (role 3: the cluster also watches this box — circular, and
#                     fine; mutual monitoring means neither side is unwatched).
#
# ── THE ONE RULE THAT MAKES THE WATCHER WORK ──────────────────────────────────
# The alert path must NOT depend on the thing it's watching. If uptime-kuma
# "screams" through a channel that itself runs on the cluster (an SMTP server, an
# ntfy/Gotify instance on a cluster VM, etc.), the scream can't escape when the
# cluster is down — which is exactly when you need it. Wire its notifications to
# an EXTERNAL/independent channel: Pushover, Telegram, a public ntfy.sh (or a
# Gotify on a DIFFERENT box), or email via an external provider. Test it by
# actually pulling the plug on the cluster.
#
# ── HONEST THREAT MODEL (what it can and can't catch) ─────────────────────────
# Its independence is only as good as its SHARED dependencies. This box has no
# usable USB port (see ../docs/01-hardware.md), so there's no easy LTE modem for
# a truly independent egress — the alert still rides your LAN/internet uplink.
# So it reliably catches CLUSTER / SOFTWARE / HOST failure (a different failure
# domain), but NOT a site-wide network or power loss that takes out the uplink
# too. Cheap ways to widen the domain it survives:
#   - Power it from a SEPARATE small UPS (PoE injector or USB-C on that UPS), so
#     a failure of the PoE switch's power doesn't also kill your watcher. Don't
#     count on PoE + USB-C *together* as redundancy: the stock power-loss udev
#     rule powers the box off when ANY supply goes offline (see
#     ../docs/07-watchdog-and-persistence.md) — test it before relying on it.
#   - Put it on a different switch / VLAN than the cluster's uplink where you can.
#
# ── HOW THE WATCHER ACTUALLY WATCHES (do both) ────────────────────────────────
#   - Active (poll):  uptime-kuma pings the cluster's key endpoints (Beszel hub
#                     URL, Proxmox API, a gateway) every minute → catches "cluster
#                     is down / unreachable."
#   - Passive (push): create Kuma "push" monitors (dead-man's-switch) and have the
#                     cluster's monitoring curl them on a schedule → catches
#                     "cluster host is up but its monitoring is wedged/silent."
#
# ARCH: current UniFi OS firmware is 64-bit (Debian 11 bullseye, aarch64 kernel),
# so `dpkg --print-architecture` is arm64 and Docker pulls arm64 images by default
# — the best-supported ARM arch, so almost everything Just Works. (On older armhf
# firmware you'd be limited to arm/v7 instead — check with dpkg.) All images here
# publish arm64. Sanity-check any image you add: docker manifest inspect <img> | grep -A2 arch
# (Lighter watcher alternatives if you want minimal footprint: Gatus (declarative,
#  tiny) or self-hosted Healthchecks (purpose-built dead-man's-switch) — both
#  ship arm64. Uptime Kuma is the batteries-included default and matches the
#  tooling you already run on the cluster.)
#
# ── Before you bring this up ──────────────────────────────────────────────────
#  1. Run ../scripts/50-install-docker.sh first (data-root -> /volume/docker,
#     kernel-appropriate storage-driver, capped logs), then PROVE Docker works on
#     this 3.18 kernel with the smoke test it prints — it's experimental here
#     (see ../docs/10-storage-and-docker.md).
#     Also install the Compose v2 plugin: Debian's docker.io has no
#     `docker compose` (recipe in docs/10, "No docker compose out of the box").
#  2. FREE PORT 53 for Technitium, if something already holds it:
#         sudo ss -lunp | grep ':53 '          # who's on 53?
#     If it's systemd-resolved's stub listener:
#         sudo mkdir -p /etc/systemd/resolved.conf.d
#         printf '[Resolve]\nDNSStubListener=no\n' | sudo tee /etc/systemd/resolved.conf.d/10-no-stub.conf
#         sudo systemctl restart systemd-resolved
#  3. Create data dirs on the SATA disk (nothing on the eMMC):
#         sudo mkdir -p /volume/appdata/{technitium,uptime-kuma,arcane-agent,beszel-agent}
#  4. Fill in every REPLACE_ME (agent tokens, hub URL/key, DNS admin password).
#  5. Firewall: ports published with `ports:` BYPASS ufw (Docker programs
#     iptables itself), so 5380/53/3001 below are LAN-reachable as-is.
#     `network_mode: host` services are the opposite — ufw filters them, so open
#     their ports yourself (e.g. `sudo ufw allow 45876/tcp` for beszel-agent if
#     your hub connects in to it; not needed if the agent dials out via HUB_URL).
#
# ── Where to put it & run it ──────────────────────────────────────────────────
#     sudo mkdir -p /volume/stacks/core && sudo cp compose.example.yml /volume/stacks/core/compose.yml
#     cd /volume/stacks/core && sudo docker compose up -d
#
# Log rotation is handled globally by daemon.json (from 50-install-docker.sh).

name: core

services:
  # ── (1) DNS server ──────────────────────────────────────────────────────────
  technitium:
    image: technitium/dns-server:latest          # pin a version tag in production
    container_name: technitium
    restart: unless-stopped
    # A DNS server benefits from host networking (real client IPs, no port
    # juggling). To use it, delete the `ports:` block and uncomment:
    # network_mode: host
    ports:
      - "5380:5380/tcp"   # web admin console
      - "53:53/udp"       # DNS
      - "53:53/tcp"       # DNS
      # - "853:853/tcp"   # DNS-over-TLS
      # - "443:443/tcp"   # DNS-over-HTTPS
      # - "67:67/udp"     # DHCP (if you serve it from here)
    environment:
      - DNS_SERVER_DOMAIN=cloudkey.lan
      - DNS_SERVER_ADMIN_PASSWORD=REPLACE_ME
    volumes:
      - /volume/appdata/technitium:/etc/dns
    sysctls:
      - net.ipv4.ip_local_port_range=1024 65000
    # Query logging is the #1 write source — it's on /volume now (off the eMMC),
    # but still trim retention in the Technitium UI.

  # ── (2) Out-of-band watcher / dead-man's-switch ─────────────────────────────
  # Watches the cluster from the outside. Configure INDEPENDENT notifications
  # (see "THE ONE RULE" above) and both active + push monitors. This is NOT a
  # copy of the cluster's holistic Kuma — different job, different failure domain.
  uptime-kuma:
    image: louislam/uptime-kuma:1                # :1 tracks the stable 1.x line
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - /volume/appdata/uptime-kuma:/app/data

  # ── Arcane AGENT — managed by the Arcane manager on your cluster ────────────
  # Edge mode: the agent dials OUT to the manager, no inbound port needed here.
  # In the manager UI: Environments -> add environment -> generate a token.
  arcane-agent:
    image: ghcr.io/getarcaneapp/agent:latest     # pin a version tag in production
    container_name: arcane-agent
    restart: unless-stopped
    environment:
      - EDGE_AGENT=true
      - EDGE_TRANSPORT=poll
      - AGENT_TOKEN=arc_REPLACE_ME
      - MANAGER_API_URL=http://REPLACE_ME_manager_host:3552   # Arcane manager on your cluster
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # root-equivalent; expected for management
      - /volume/appdata/arcane-agent:/app/data
    # ── Direct mode instead (manager connects IN on 3553):
    # environment:
    #   - AGENT_MODE=true
    #   - EDGE_TRANSPORT=poll
    #   - AGENT_TOKEN=arc_REPLACE_ME
    #   - MANAGER_API_URL=http://REPLACE_ME_manager_host:3552
    # ports:
    #   - "3553:3553"

  # ── Beszel AGENT — reports this box's metrics to your central Beszel hub ─────
  # Fanless box: the hub can alert on temperature, disk-full, container-down.
  # Get KEY + TOKEN from the hub (add system / Settings -> Tokens).
  beszel-agent:
    image: henrygd/beszel-agent:latest           # pin a version tag in production
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host                            # needs host net for interface stats
                                                  # (host net => ufw applies: see step 5 above)
    volumes:
      - /volume/appdata/beszel-agent:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro   # read-only: container stats only
    environment:
      LISTEN: 45876
      KEY: "REPLACE_ME_hub_public_key"
      TOKEN: "REPLACE_ME_hub_token"
      HUB_URL: "http://REPLACE_ME_beszel_hub:8090"

  # ── OPTIONAL: autoheal — restart a container that reports UNHEALTHY ──────────
  # Only acts on containers that DEFINE a healthcheck and go unhealthy.
  # `restart: unless-stopped` already covers a crashed process; autoheal adds the
  # "alive but wedged" case. Worth it for DNS you depend on — but you must add a
  # healthcheck to technitium for it to fire (verify the probe binary exists in
  # that image). Verify the autoheal image ships arm64 before use.
  # autoheal:
  #   image: willfarrell/autoheal:latest
  #   container_name: autoheal
  #   restart: unless-stopped
  #   environment:
  #     - AUTOHEAL_CONTAINER_LABEL=all
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock

  # ── OPTIONAL: watchtower — auto-update images ───────────────────────────────
  # Skip it here. On this old-kernel (3.18) box an unattended pull can grab an image
  # that needs a newer kernel and silently break it. Arcane already manages this
  # host from your cluster — update DELIBERATELY from there. If you only want to
  # KNOW about updates, run watchtower with WATCHTOWER_MONITOR_ONLY=true.
  # watchtower:
  #   image: containrrr/watchtower:latest
  #   container_name: watchtower
  #   restart: unless-stopped
  #   environment:
  #     - WATCHTOWER_MONITOR_ONLY=true
  #     - WATCHTOWER_SCHEDULE=0 0 4 * * *
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
